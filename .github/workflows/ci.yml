name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Select stable Rust
        run: rustup default stable

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Build the release verifier
        run: cargo build --release -p redsim

      - name: Test the Rust workspace
        run: cargo test --workspace

      - name: Test the Python package
        run: python -m pytest tests -q

      - name: Lint the Python package
        run: python -m ruff check .
